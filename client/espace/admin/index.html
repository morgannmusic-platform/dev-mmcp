<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration — Morgann Dev CP</title>
    <style>
        :root {
            --bg: #121513;
            --card-bg: #1a201c;
            --sage: #88a795;
            --gold: #d4af37;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: rgba(136, 167, 149, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar-brand {
            font-weight: 700;
            color: var(--sage);
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }

        .sidebar-item {
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background: rgba(136, 167, 149, 0.15);
            color: var(--text);
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #121513;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem;
            border-radius: 6px;
            margin-top: 0.25rem;
            margin-bottom: 1rem;
        }

        button {
            background: var(--sage);
            color: #121513;
            border: none;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
        }

        .progress-fill {
            background: var(--sage);
            height: 100%;
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-brand">MDCP Admin</div>
        <a href="#/demandes" class="sidebar-item">Demandes</a>
        <a href="#/projets" class="sidebar-item">Projets</a>
        <a href="#/creer-projet" class="sidebar-item">+ Nouveau Projet</a>
        <a href="#/emails" class="sidebar-item">Envoyer Email</a>
    </aside>

    <main id="app-view" class="main-content">
        <!-- Vues injectées dynamiquement -->
    </main>

    <script type="module" src="admin.js"></script>
</body>

</html>
