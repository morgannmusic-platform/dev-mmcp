<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devis Sur-Mesure Instantané — Morgann Dev CP</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .devis-form {
            background: rgba(254, 255, 242, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(136, 167, 149, 0.3);
            border-radius: 30px;
            padding: 2.5rem;
            max-width: 850px;
            margin: 0 auto;
            box-shadow: 0 8px 24px rgba(0, 49, 8, 0.2);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #121513;
        }

        .form-control,
        select,
        textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 49, 8, 0.2);
            background: rgba(255, 255, 255, 0.9);
            font-family: inherit;
            font-size: 0.95rem;
            color: #1a201c;
            outline: none;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.6);
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            border: 1px solid rgba(0, 49, 8, 0.1);
            cursor: pointer;
        }

        .checkbox-item.pro-bono-item {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            font-weight: 600;
        }

        .checkbox-item input {
            accent-color: #003108;
            width: 18px;
            height: 18px;
        }

        .result-box {
            display: none;
            margin-top: 2rem;
            background: #003108;
            color: #e2e8f0;
            border-radius: 25px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 49, 8, 0.3);
        }

        .price-display {
            font-size: 2.8rem;
            font-weight: 800;
            color: #a3bcb7;
            margin: 0.8rem 0;
        }

        .badge-pack {
            display: inline-block;
            background: rgba(163, 188, 183, 0.2);
            color: #a3bcb7;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .loader {
            display: none;
            margin: 1.5rem auto;
            border: 4px solid rgba(0, 49, 8, 0.2);
            border-top: 4px solid #003108;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="container" style="margin-top: 2rem;">
        <form id="devisForm" class="devis-form">

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label for="projectType">Type de structure</label>
                    <select id="projectType" required>
                        <option value="Site Vitrine / Landing Page">Site Vitrine / Landing Page</option>
                        <option value="Site Multi-pages / Web App">Site Multi-pages / Web App</option>
                        <option value="Plateforme Sur-Mesure / SaaS">Plateforme Sur-Mesure / SaaS</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pages">Volume de pages</label>
                    <select id="pages" required>
                        <option value="1 à 3 pages">1 à 3 pages</option>
                        <option value="4 à 6 pages">4 à 6 pages</option>
                        <option value="Plus de 6 pages">Plus de 6 pages</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="deadline">Délai de réalisation</label>
                    <select id="deadline" required>
                        <option value="Express (- 7 jours)">Express (Moins de 7 jours)</option>
                        <option value="1 à 2 semaines">Rapide (1 à 2 semaines)</option>
                        <option value="3 à 4 semaines" selected>Standard (3 à 4 semaines)</option>
                        <option value="1 à 2 mois">Flexible (1 à 2 mois)</option>
                        <option value="Plus de 2 mois">Projet à long terme (+ de 2 mois)</option>
                    </select>
                </div>
            </div>

            <!-- Option Engagement Solidaire -->
            <div class="form-group">
                <label>Statut de votre organisme</label>
                <label class="checkbox-item pro-bono-item">
                    <input type="checkbox" id="isProBono"> Association à but non lucratif / Pompiers / Médical d'Urgence
                    (Tarif Solidaire)
                </label>
            </div>

            <div class="form-group">
                <label>Fonctionnalités & Modules spécifiques</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" name="features"
                            value="Espace Membre & Authentification"> Authentification Client</label>
                    <label class="checkbox-item"><input type="checkbox" name="features"
                            value="Base de données Cloudflare D1/KV"> Base de données Cloud</label>
                    <label class="checkbox-item"><input type="checkbox" name="features"
                            value="Paiement en ligne Stripe"> Intégration Stripe / Dons</label>
                    <label class="checkbox-item"><input type="checkbox" name="features"
                            value="Modules IA & Cloudflare Workers"> Traitements & Modules IA</label>
                    <label class="checkbox-item"><input type="checkbox" name="features" value="Tableau de bord Admin">
                        Dashboard Administration</label>
                    <label class="checkbox-item"><input type="checkbox" name="features" value="Support Multilingue">
                        Support Multilingue (i18n)</label>
                    <label class="checkbox-item"><input type="checkbox" name="features"
                            value="Design & Charte Graphique Sur-Mesure"> Design & UI Sur-Mesure</label>
                    <label class="checkbox-item"><input type="checkbox" name="features"
                            value="Optimisation SEO Avancée"> Optimisation SEO & Vitesse</label>
                    <label class="checkbox-item"><input type="checkbox" name="features"
                            value="Système de Prise de RDV / Garde"> Module de RDV / Gardes</label>
                    <label class="checkbox-item"><input type="checkbox" name="features"
                            value="Hébergement & Maintenance 1 An"> Maintenance & Gestion (1 an)</label>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Précisions supplémentaires (facultatif)</label>
                <textarea id="description" rows="3" class="form-control"
                    placeholder="Nom de l'association, détails sur la mission..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-primary"
                style="width: 100%; border: none; cursor: pointer; padding: 1rem;">
                Calculer mon devis exact
            </button>

            <div id="loader" class="loader"></div>
        </form>

        <div id="resultBox" class="result-box" style="max-width: 850px; margin: 2rem auto 0;">
            <span id="recommendedPack" class="badge-pack">Formule Conseillée</span>
            <h2>Estimation globale de votre projet</h2>
            <div id="priceDisplay" class="price-display">0 € – 0 €</div>
            <p id="explanationText" style="color: #cbd5e1; line-height: 1.6; max-width: 650px; margin: 0 auto;"></p>

            <div style="margin-top: 1.8rem;">
                <a href="https://mm-cp.uk" class="btn-primary"
                    style="background: #a3bcb7; color: #003108; border-color: #a3bcb7; text-decoration: none; padding: 0.8rem 1.5rem; border-radius: 12px; font-weight: bold;">
                    Valider mon cahier des charges
                </a>
            </div>
        </div>
    </main>

    <script>
        const WORKER_URL = 'https://form.ai.dev.mm-cp.uk/';

        const devisForm = document.getElementById('devisForm');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('resultBox');

        devisForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            resultBox.style.display = 'none';
            submitBtn.style.display = 'none';
            loader.style.display = 'block';

            const selectedFeatures = Array.from(document.querySelectorAll('input[name="features"]:checked'))
                .map(cb => cb.value);

            const payload = {
                projectType: document.getElementById('projectType').value,
                pages: document.getElementById('pages').value,
                deadline: document.getElementById('deadline').value,
                isProBono: document.getElementById('isProBono').checked,
                features: selectedFeatures,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.isSolidarity) {
                    // Style spécifique pour tarif solidaire (badge vert émeraude)
                    document.getElementById('recommendedPack').textContent = `❤️ Offre Solidaire : -50% à -70% appliqué`;
                    document.getElementById('recommendedPack').style.background = "rgba(16, 185, 129, 0.25)";
                    document.getElementById('recommendedPack').style.color = "#6ee7b7";
                } else if (data.adjustedDeadline) {
                    document.getElementById('recommendedPack').textContent = `⏳ Planning suggéré : ${data.suggestedDeadline}`;
                    document.getElementById('recommendedPack').style.background = "rgba(234, 179, 8, 0.2)";
                    document.getElementById('recommendedPack').style.color = "#fef08a";
                } else {
                    document.getElementById('recommendedPack').textContent = `Formule conseillée : ${data.recommendedPack}`;
                    document.getElementById('recommendedPack').style.background = "rgba(163, 188, 183, 0.2)";
                    document.getElementById('recommendedPack').style.color = "#a3bcb7";
                }

                document.getElementById('priceDisplay').textContent = `${data.minPrice} € – ${data.maxPrice} €`;
                document.getElementById('explanationText').textContent = data.explanation;

                resultBox.style.display = 'block';
            } catch (error) {
                alert("Erreur lors du calcul de l'estimation.");
                console.error(error);
            } finally {
                loader.style.display = 'none';
                submitBtn.style.display = 'block';
            }
        });
    </script>
</body>

</html>
